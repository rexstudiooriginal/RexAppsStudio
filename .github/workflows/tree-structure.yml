name: Show Repository Tree

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tree (if not available)
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Generate tree structure
        run: |
          echo "📁 Repository structure (max depth 4):" > tree_output.txt
          tree -L 4 -F --dirsfirst >> tree_output.txt
          echo "" >> tree_output.txt
          echo "✅ Generated on $(date)" >> tree_output.txt

      - name: Show tree in log
        run: cat tree_output.txt

      - name: Upload tree output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-tree
          path: tree_output.txt